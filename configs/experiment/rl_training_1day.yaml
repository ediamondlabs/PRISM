# @package _global_

# RL Training - OPTIMIZED FOR 1 DAY COMPLETION (50 vehicles)
# This config balances speed and performance for realistic training times

defaults:
  - /data: v2v_trajectories
  - /model: lstm_autoencoder
  - /simulation: v2v_env
  - _self_

# Experiment name
experiment_name: rl_training_1day_50vehicles

# Random seed
seed: 42

# Device
device: auto  # 'cuda', 'cpu', or 'auto'

# Output directories
output_dir: outputs/rl
mlflow_tracking_uri: outputs/mlruns

# RL-specific overrides
rl:
  # Actor configuration
  actor:
    state_dim: 106  # 10 local + 96 neighbor encoding
    shared_hidden_dim: 128
    who_hidden_dim: 64
    what_hidden_dim: 64
    max_neighbors: 20
    k_neighbors: 2
    num_repr_types: 3
    dropout: 0.1

  # Critic configuration
  critic:
    type: centralized  # Use centralized critic for CTDE
    state_dim: 106
    num_vehicles: 50
    hidden_dim: 256
    num_layers: 3
    dropout: 0.1

  # PPO hyperparameters
  ppo:
    lr_actor: 3.0e-4
    lr_critic: 1.0e-3
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    max_grad_norm: 0.5

  # Training settings - OPTIMIZED FOR 1 DAY
  training:
    num_updates: 800  # Realistic for 50 vehicles in ~18 hours
    num_epochs_per_update: 4  # Optimal: prevents overfitting, faster
    batch_size: 256  # Good GPU utilization
    buffer_size: 512  # CRITICAL: 512 steps × 50 vehicles = 25,600 steps/update
    save_interval: 50  # Save more frequently
    eval_interval: 50
    log_interval: 10

  # Reward function
  reward:
    immediate_weight: 0.3
    global_weight: 0.7
    perf_scale: 100.0
    comm_cost_scale: 0.01
    success_bonus: 1.0

    # Immediate reward components
    anomaly_detection_weight: 0.5
    communication_success_weight: 0.3
    neighbor_stability_weight: 0.2

# Simulation overrides - OPTIMIZED FOR SPEED
simulation:
  num_vehicles: 50
  comm_range_m: 300.0
  max_episode_timesteps: 60  # Reduced from 100 - still captures dynamics
  use_neighbor_encoder: false
  layer1_checkpoint: outputs/checkpoints/best_model.pt

# Data overrides
data:
  num_vehicles: 50
  batch_size: 32

```
